<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="projects-title projects-desc">
<title id="projects-title">Sunnyth selected projects</title>
<desc id="projects-desc">Three animated project cards linking to the DoratriX, LeakLock, and Currency Converter GitHub repositories.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#000" flood-opacity=".4"/></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".07"/></pattern>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07152e"/><stop offset=".54" stop-color="#090d20"/><stop offset="1" stop-color="#041b2a"/></linearGradient>
  <linearGradient id="blue" x2="1"><stop stop-color="#087dff"/><stop offset="1" stop-color="#39d6ff"/></linearGradient>
  <linearGradient id="pink" x2="1"><stop stop-color="#f53683"/><stop offset="1" stop-color="#b94dff"/></linearGradient>
  <linearGradient id="cyan" x2="1"><stop stop-color="#00c8d7"/><stop offset="1" stop-color="#20f0c5"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#147dff" stop-opacity=".2"/><stop offset="1" stop-color="#147dff" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .display{font-family:Inter,Arial,sans-serif;font-weight:800;letter-spacing:-1px}.mono{font-family:'Noto Sans Mono',monospace;letter-spacing:.2px}
  .card{fill:#09172d;fill-opacity:.9;stroke-width:1.5;transition:fill .2s ease,fill-opacity .2s ease,stroke-width .2s ease}
  .tile{transform-box:fill-box;transform-origin:center;animation:float 4.5s ease-in-out infinite}
  .tile2{animation-delay:-1.5s}.tile3{animation-delay:-3s}.orbit{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
  .pulse{animation:pulse 2.5s ease-in-out infinite}
  .project{cursor:pointer}.project:hover .card,.project:focus .card{fill:#050d1c;fill-opacity:1;stroke-width:2.5}.project:active .card{fill:#030815;fill-opacity:1}.project:hover .cta,.project:focus .cta{text-decoration:underline}.project:hover .arrow,.project:focus .arrow{transform:translateX(5px)}
  .arrow{transition:transform .2s ease}.focus:focus .card{stroke-width:3;stroke:#fff}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/><rect width="1200" height="720" rx="28" fill="url(#dots)"/>
<circle cx="1030" cy="100" r="270" fill="url(#glow)"/><circle cx="110" cy="630" r="260" fill="url(#glow)"/>
<text x="64" y="62" class="mono" font-size="13" fill="#8aa6cb">03 / PROJECTS</text>
<text x="64" y="126" class="display" font-size="52" fill="#f5f8ff">SELECTED BUILDS.</text>
<text x="64" y="160" class="mono" font-size="14" fill="#91a4c1">THREE IDEAS, SHIPPED WITH PURPOSE.</text>
<g transform="translate(52 210)">
 <a class="project focus" href="https://github.com/Sunnyth10/DoratriX" target="_blank" rel="noopener" aria-label="Open DoratriX GitHub repository">
  <rect width="350" height="406" rx="22" class="card" stroke="#168cff" filter="url(#shadow)"/><rect x="7" y="2" width="336" height="5" rx="2.5" fill="url(#blue)"/>
  <rect x="24" y="22" width="42" height="30" rx="10" fill="#07336b" stroke="#168cff"/><text x="45" y="42" text-anchor="middle" class="mono" font-size="12" fill="#60d9ff">01</text>
  <g class="tile" transform="translate(205 24) scale(.92)"><path d="M0 24 45 8l47 18v68L45 112 0 94z" fill="#073772" stroke="#31aeff" stroke-width="2"/><path d="M45 8v104M0 24l45 19 47-17" fill="none" stroke="#3b9dff" stroke-width="2"/><path d="M12 71c15-38 28 29 44-7s20-6 31-35" fill="none" stroke="#28ddff" stroke-width="3" stroke-dasharray="6 5"/><circle cx="12" cy="58" r="7" fill="#b9f6ff" stroke="#14aaff" stroke-width="3"/><circle cx="87" cy="29" r="7" fill="#b9f6ff" stroke="#14aaff" stroke-width="3"/><circle cx="66" cy="82" r="18" fill="#087dff" stroke="#67d9ff" stroke-width="2"/><path d="m57 82 15-9-7 17-2-7z" fill="#fff"/></g>
  <text x="30" y="156" class="display" font-size="28" fill="#f5f7fb">DoratriX</text><text x="30" y="188" class="mono" font-size="12" fill="#39d6ff">PATHFINDING / VISUALIZATION</text>
  <text x="30" y="235" font-family="Arial,sans-serif" font-size="16" fill="#c7d6eb"><tspan x="30">Interactive pathfinding and map</tspan><tspan x="30" dy="25">visualization demonstrating graph</tspan><tspan x="30" dy="25">algorithms through visual route</tspan><tspan x="30" dy="25">generation.</tspan></text>
  <text x="30" y="344" class="mono" font-size="11" fill="#8297b6">JAVASCRIPT · FRONTEND · GRAPH ALGORITHMS</text><circle cx="45" cy="378" r="15" fill="none" stroke="#39d6ff" stroke-width="2"/><path class="arrow" d="M38 378h13m-6-6 6 6-6 6" fill="none" stroke="#39d6ff" stroke-width="2"/><text x="74" y="383" class="mono cta" font-size="13" fill="#39d6ff">VIEW REPOSITORY</text>
 </a>
</g>
<g transform="translate(425 210)">
 <a class="project focus" href="https://github.com/Sunnyth10/leaklock" target="_blank" rel="noopener" aria-label="Open LeakLock GitHub repository">
  <rect width="350" height="406" rx="22" class="card" stroke="#ed3988" filter="url(#shadow)"/><rect x="7" y="2" width="336" height="5" rx="2.5" fill="url(#pink)"/>
  <rect x="24" y="22" width="42" height="30" rx="10" fill="#4a1239" stroke="#ed3988"/><text x="45" y="42" text-anchor="middle" class="mono" font-size="12" fill="#ff8bbd">02</text>
  <g class="tile tile2" transform="translate(208 23) scale(.9)"><path d="M49 4 94 22v34c0 34-25 53-45 63C29 109 4 90 4 56V22z" fill="#641340" stroke="#ff4e9d" stroke-width="3"/><path d="M49 18 81 31v24c0 23-15 37-32 47-17-10-32-24-32-47V31z" fill="#a91d67" opacity=".65"/><rect x="35" y="50" width="29" height="25" rx="6" fill="#ff5eaa"/><path d="M41 50v-7a8 8 0 0 1 16 0v7" fill="none" stroke="#ffc5df" stroke-width="5"/><circle cx="49" cy="61" r="3" fill="#651039"/><g class="orbit" fill="#ff6bae"><circle cx="1" cy="44" r="3"/><circle cx="97" cy="77" r="3"/></g><path class="pulse" d="M0 44h13m81 33h12" stroke="#ff4e9d" stroke-width="2"/></g>
  <text x="30" y="156" class="display" font-size="28" fill="#f5f7fb">LeakLock</text><text x="30" y="188" class="mono" font-size="12" fill="#ff65a8">DEVELOPER SECURITY / SECRETS</text>
  <text x="30" y="235" font-family="Arial,sans-serif" font-size="16" fill="#c7d6eb"><tspan x="30">Detects leaked secrets and</tspan><tspan x="30" dy="25">credentials in code, helping</tspan><tspan x="30" dy="25">prevent sensitive information from</tspan><tspan x="30" dy="25">reaching repositories.</tspan></text>
  <text x="30" y="344" class="mono" font-size="11" fill="#8297b6">TYPESCRIPT · SECURITY TOOLING</text><circle cx="45" cy="378" r="15" fill="none" stroke="#ff65a8" stroke-width="2"/><path class="arrow" d="M38 378h13m-6-6 6 6-6 6" fill="none" stroke="#ff65a8" stroke-width="2"/><text x="74" y="383" class="mono cta" font-size="13" fill="#ff65a8">VIEW REPOSITORY</text>
 </a>
</g>
<g transform="translate(798 210)">
 <a class="project focus" href="https://github.com/Sunnyth10/currency-converter" target="_blank" rel="noopener" aria-label="Open Currency Converter GitHub repository">
  <rect width="350" height="406" rx="22" class="card" stroke="#00d4d8" filter="url(#shadow)"/><rect x="7" y="2" width="336" height="5" rx="2.5" fill="url(#cyan)"/>
  <rect x="24" y="22" width="42" height="30" rx="10" fill="#06434d" stroke="#00d4d8"/><text x="45" y="42" text-anchor="middle" class="mono" font-size="12" fill="#56f5e0">03</text>
  <g class="tile tile3" transform="translate(208 27) scale(.9)"><ellipse cx="35" cy="20" rx="34" ry="12" fill="#25c7ff" stroke="#72ecff" stroke-width="2"/><path d="M1 20v54c0 7 15 12 34 12s34-5 34-12V20" fill="#0873ca" stroke="#42d7ff" stroke-width="2"/><path d="M1 38c0 7 15 12 34 12s34-5 34-12M1 56c0 7 15 12 34 12s34-5 34-12" fill="none" stroke="#40d4ff" stroke-width="3"/><circle cx="79" cy="72" r="28" fill="#087dff" stroke="#68e5ff" stroke-width="3"/><text x="79" y="84" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#fff">$</text><path class="pulse" d="M68 5c20-15 43-2 47 13m0 0-12-1m12 1-2-12" fill="none" stroke="#1de3c6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="30" y="156" class="display" font-size="26" fill="#f5f7fb">Currency Converter</text><text x="30" y="188" class="mono" font-size="12" fill="#20e6db">REAL-TIME / EXTERNAL APIs</text>
  <text x="30" y="235" font-family="Arial,sans-serif" font-size="16" fill="#c7d6eb"><tspan x="30">Real-time currency conversion</tspan><tspan x="30" dy="25">application using external APIs to</tspan><tspan x="30" dy="25">fetch and display up-to-date</tspan><tspan x="30" dy="25">exchange rates.</tspan></text>
  <text x="30" y="344" class="mono" font-size="11" fill="#8297b6">HTML · CSS · JAVASCRIPT · APIs</text><circle cx="45" cy="378" r="15" fill="none" stroke="#20e6db" stroke-width="2"/><path class="arrow" d="M38 378h13m-6-6 6 6-6 6" fill="none" stroke="#20e6db" stroke-width="2"/><text x="74" y="383" class="mono cta" font-size="13" fill="#20e6db">VIEW REPOSITORY</text>
 </a>
</g>
</svg>
